<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#050814" />
      <stop offset="100%" stop-color="#02040a" />
    </radialGradient>
    <linearGradient id="orbitArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="panelGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="thrustCyan" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a5f3fc" />
    </linearGradient>
    <radialGradient id="earthGlow" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.7" />
      <stop offset="40%" stop-color="#0369a1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="#1e293b" stroke-width="3" />

  <!-- Earth Atmospheric Limb -->
  <ellipse cx="256" cy="560" rx="360" ry="180" fill="url(#earthGlow)" />
  <path d="M -80 470 Q 256 380 592 470" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.8" filter="url(#neonGlow)" />
  <path d="M -80 470 Q 256 380 592 470" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.9" />

  <!-- Orbital Trajectory Ellipse -->
  <ellipse cx="256" cy="240" rx="200" ry="90" transform="rotate(-18 256 240)" fill="none" stroke="url(#orbitArc)" stroke-width="2.5" stroke-dasharray="8 6" />

  <!-- Distant Stars -->
  <circle cx="90" cy="110" r="2.5" fill="#ffffff" opacity="0.8" />
  <circle cx="410" cy="80" r="3" fill="#38bdf8" opacity="0.9" />
  <circle cx="430" cy="310" r="2" fill="#ffffff" opacity="0.6" />
  <circle cx="120" cy="340" r="2" fill="#facc15" opacity="0.7" />
  <circle cx="270" cy="70" r="2.5" fill="#e2e8f0" opacity="0.8" />

  <!-- Ion Thruster Flame Trail -->
  <path d="M 170 248 Q 120 252 60 256 Q 130 242 170 248 Z" fill="url(#thrustCyan)" filter="url(#neonGlow)" />
  <circle cx="170" cy="248" r="7" fill="#67e8f9" filter="url(#neonGlow)" />

  <!-- Center Satellite Group -->
  <g transform="translate(256, 235) rotate(-8)">
    <!-- Left Solar Array -->
    <rect x="-105" y="-18" width="65" height="36" rx="4" fill="url(#panelGold)" stroke="#b45309" stroke-width="1.5" />
    <line x1="-72.5" y1="-18" x2="-72.5" y2="18" stroke="#78350f" stroke-width="1.5" />
    <line x1="-105" y1="0" x2="-40" y2="0" stroke="#78350f" stroke-width="1.5" />
    <!-- Connector -->
    <line x1="-40" y1="0" x2="-22" y2="0" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />

    <!-- Satellite Core Chassis -->
    <rect x="-22" y="-24" width="44" height="48" rx="7" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" filter="url(#neonGlow)" />
    <rect x="-22" y="-24" width="44" height="48" rx="7" fill="#0f172a" stroke="#cbd5e1" stroke-width="1" />
    
    <!-- Sensor Dome / Core Lens -->
    <circle cx="0" cy="0" r="10" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <circle cx="0" cy="0" r="4" fill="#67e8f9" />
    <circle cx="-3" cy="-3" r="1.5" fill="#ffffff" />

    <!-- Communications Antenna Dish -->
    <path d="M 12 -24 L 28 -42" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 22 -44 Q 30 -42 36 -34" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <circle cx="34" cy="-36" r="2.5" fill="#facc15" />

    <!-- Right Solar Array -->
    <line x1="22" y1="0" x2="40" y2="0" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <rect x="40" y="-18" width="65" height="36" rx="4" fill="url(#panelGold)" stroke="#b45309" stroke-width="1.5" />
    <line x1="72.5" y1="-18" x2="72.5" y2="18" stroke="#78350f" stroke-width="1.5" />
    <line x1="40" y1="0" x2="105" y2="0" stroke="#78350f" stroke-width="1.5" />
  </g>

  <!-- Orbital Debris Hazards -->
  <polygon points="380,180 392,185 388,198 375,195" fill="#f59e0b" stroke="#fbbf24" stroke-width="1.5" />
  <polygon points="320,330 330,334 326,344 316,340" fill="#ef4444" stroke="#f87171" stroke-width="1.5" />
</svg>
